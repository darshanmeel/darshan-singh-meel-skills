<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype: NAME</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
  [data-variant] { display: none; padding: 24px 24px 96px; }
  [data-variant].on { display: block; }
  /* the bar is not part of the design under test: fixed, high contrast */
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 12px;
         align-items: center; padding: 8px 12px; border-radius: 999px; background: #111; color: #fff; }
  #bar button { font: inherit; color: inherit; background: none; border: 1px solid #777; border-radius: 999px;
                width: 36px; height: 36px; cursor: pointer; }
</style>
</head>
<body>
<!-- one section per variant; data-name = the structure in a few words. Synthetic content only. -->
<section data-variant="A" data-name="STRUCTURE A"></section>
<section data-variant="B" data-name="STRUCTURE B"></section>
<section data-variant="C" data-name="STRUCTURE C"></section>

<nav id="bar" aria-label="Prototype variant">
  <button id="prev" aria-label="Previous variant">&larr;</button>
  <span id="label" aria-live="polite"></span>
  <button id="next" aria-label="Next variant">&rarr;</button>
</nav>
<script>
  const all = [...document.querySelectorAll("[data-variant]")];
  const keys = all.map((s) => s.dataset.variant);
  function show(key) {
    const i = Math.max(keys.indexOf(key), 0);
    all.forEach((s, n) => s.classList.toggle("on", n === i));
    document.getElementById("label").textContent = keys[i] + " - " + all[i].dataset.name;
    history.replaceState(null, "", "?variant=" + keys[i]);
    return i;
  }
  let at = show(new URLSearchParams(location.search).get("variant"));
  const move = (d) => { at = show(keys[(at + d + keys.length) % keys.length]); };
  document.getElementById("prev").onclick = () => move(-1);
  document.getElementById("next").onclick = () => move(1);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (e.key === "ArrowLeft") move(-1);
    if (e.key === "ArrowRight") move(1);
  });
</script>
</body>
</html>
