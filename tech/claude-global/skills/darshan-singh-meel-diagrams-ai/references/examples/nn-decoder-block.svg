0.5,734" marker-end="url(#dg-nn-decoder-block-filled-muted)"/><g class="dg-n dg-t-soft" data-id="tokens"><rect class="dg-sh" x="138.5" y="16" width="108" height="40" rx="20"/><text class="dg-l" x="192.5" y="39.6" text-anchor="middle">Token ids</text></g><g class="dg-n dg-t-green" data-id="embed"><rect class="dg-sh" x="124" y="100" width="137" height="52" rx="8"/><text class="dg-l" x="192.5" y="121.1" text-anchor="middle">Token + position</text><text class="dg-l" x="192.5" y="138.1" text-anchor="middle">embedding</text></g><g class="dg-n dg-t-soft" data-id="ln1"><rect class="dg-sh" x="142" y="274" width="101" height="40" rx="8"/><text class="dg-l" x="192.5" y="297.6" text-anchor="middle">LayerNorm</text></g><g class="dg-n dg-t-lav" data-id="attn"><rect class="dg-sh" x="111" y="358" width="163" height="50" rx="8"/><text class="dg-l" x="192.5" y="379.1" text-anchor="middle">Causal self-attention</text><text class="dg-s" x="192.5" y="394.9" text-anchor="middle">12 heads</text></g><g class="dg-n dg-t-soft" data-id="add1"><rect class="dg-sh" x="144.5" y="452" width="96" height="40" rx="8"/><text class="dg-l" x="192.5" y="475.6" text-anchor="middle">Add</text></g><g class="dg-n dg-t-soft" data-id="ln2"><rect class="dg-sh" x="142" y="536" width="101" height="40" rx="8"/><text class="dg-l" x="192.5" y="559.6" text-anchor="middle">LayerNorm</text></g><g class="dg-n dg-t-teal" data-id="mlp"><rect class="dg-sh" x="102" y="620" width="181" height="50" rx="8"/><text class="dg-l" x="192.5" y="641.1" text-anchor="middle">Feed-forward</text><text class="dg-s" x="192.5" y="656.9" text-anchor="middle">768 → 3072 → 768, GELU</text></g><g class="dg-n dg-t-soft" data-id="add2"><rect class="dg-sh" x="144.5" y="714" width="96" height="40" rx="8"/><text class="dg-l" x="192.5" y="737.6" text-anchor="middle">Add</text></g><g class="dg-n dg-t-blue" data-id="head"><rect class="dg-sh" x="116" y="812" width="153" height="50" rx="8"/><text class="dg-l" x="192.5" y="833.1" text-anchor="middle">Classification head</text><text class="dg-s" x="192.5" y="848.9" text-anchor="middle">last token</text></g><g class="dg-n dg-t-soft" data-id="probs"><rect class="dg-sh" x="90" y="906" width="205" height="40" rx="20"/><text class="dg-l" x="192.5" y="929.6" text-anchor="middle">Softmax over 24 queues</text></g><g class="dg-lb"><rect x="161.1" y="70" width="62.8" height="16" rx="3"/><text x="192.5" y="81.8" text-anchor="middle">[B, 512]</text></g><g class="dg-lb"><rect x="144.6" y="205" width="95.8" height="16" rx="3"/><text x="192.5" y="216.8" text-anchor="middle">[B, 512, 768]</text></g><g class="dg-lb"><rect x="144.6" y="775" width="95.8" height="16" rx="3"/><text x="192.5" y="786.8" text-anchor="middle">[B, 512, 768]</text></g><g class="dg-lb"><rect x="164.4" y="876" width="56.2" height="16" rx="3"/><text x="192.5" y="887.8" text-anchor="middle">[B, 24]</text></g><g class="dg-n dg-t-soft"><rect class="dg-sh" x="17" y="965" width="18" height="12" rx="6"/></g><text class="dg-lg" x="42" y="975">input / output</text><g class="dg-n dg-t-green"><rect class="dg-sh" x="153.4" y="965" width="18" height="12" rx="2"/></g><text class="dg-lg" x="178.4" y="975">embedding</text><g class="dg-n dg-t-soft"><rect class="dg-sh" x="17" y="985" width="18" height="12" rx="2"/></g><text class="dg-lg" x="42" y="995">add / norm</text><g class="dg-n dg-t-lav"><rect class="dg-sh" x="127" y="985" width="18" height="12" rx="2"/></g><text class="dg-lg" x="152" y="995">attention</text><g class="dg-n dg-t-teal"><rect class="dg-sh" x="230.4" y="985" width="18" height="12" rx="2"/></g><text class="dg-lg" x="255.4" y="995">feed-forward</text><g class="dg-n dg-t-blue"><rect class="dg-sh" x="17" y="1005" width="18" height="12" rx="2"/></g><text class="dg-lg" x="42" y="1015">projection / head</text><path class="dg-e solid c-muted" d="M16,1031 H36"/><text class="dg-lg" x="42" y="1035">residual (skip) connection</text></g><text class="dg-key" x="16" y="1122">Key: Top to bottom = forward pass · frame =</text><