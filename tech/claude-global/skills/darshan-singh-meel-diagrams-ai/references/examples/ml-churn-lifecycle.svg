width="727" height="464"/><text class="dg-title" x="16" y="22">Churn model: from training data to monitored production and back</text><g transform="translate(0,32)"><defs><marker id="dg-ml-churn-lifecycle-filled-n" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-mk" d="M1,1 L12,5 L1,9 Z"/></marker><marker id="dg-ml-churn-lifecycle-filled-blue" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-mk c-blue" d="M1,1 L12,5 L1,9 Z"/></marker></defs><g class="dg-grp" data-id="dev"><rect x="56" y="16" width="654.4" height="103" rx="10"/><text x="66" y="33.5">Experimentation (weekly)</text></g><g class="dg-grp" data-id="prod"><rect x="61.5" y="163" width="642.9" height="119" rx="10"/><text x="71.5" y="180.5">Production (always on)</text></g><path class="dg-e solid" d="M208,80 L278.5,80" marker-end="url(#dg-ml-churn-lifecycle-filled-n)"/><path class="dg-e solid" d="M404.5,80 L551.4,80" marker-end="url(#dg-ml-churn-lifecycle-filled-n)"/><path class="dg-e solid" d="M623.9,105 L623.9,202" marker-end="url(#dg-ml-churn-lifecycle-filled-n)"/><path class="dg-e solid" d="M623.9,268 L623.9,293 Q623.9,298 618.9,298 L355.5,298 Q350.5,298 350.5,293 L350.5,260" marker-end="url(#dg-ml-churn-lifecycle-filled-n)"/><path class="dg-e solid" d="M332.5,260 L332.5,265 Q332.5,270 327.5,270 L144,270 Q139,270 139,265 L139,260" marker-end="url(#dg-ml-churn-lifecycle-filled-n)"/><path class="dg-e dashed c-blue" d="M623.9,105 L623.9,134 Q623.9,139 618.9,139 L346.5,139 Q341.5,139 341.5,134 L341.5,105" marker-end="url(#dg-ml-churn-lifecycle-filled-blue)"/><path class="dg-e dashed c-blue" d="M75.5,235 L43,235 Q38,235 38,230 L38,85 Q38,80 43,80 L70,80" marker-end="url(#dg-ml-churn-lifecycle-filled-blue)"/><g class="dg-n dg-t-plain" data-id="prep"><rect class="dg-sh" x="70" y="55" width="138" height="50" rx="8"/><text class="dg-l" x="139" y="76.1" text-anchor="middle">Build training set</text><text class="dg-s" x="139" y="91.9" text-anchor="middle">dbt, 24 months</text></g><g class="dg-n dg-t-lav" data-id="train"><rect class="dg-sh" x="278.5" y="55" width="126" height="50" rx="8"/><text class="dg-l" x="341.5" y="76.1" text-anchor="middle">Train</text><text class="dg-s" x="341.5" y="91.9" text-anchor="middle">gradient boosting</text></g><g class="dg-n dg-t-amber" data-id="evaluate"><polygon class="dg-sh" points="563.9,55 683.9,55 696.4,80 683.9,105 563.9,105 551.4,80"/><text class="dg-l" x="623.9" y="76.1" text-anchor="middle">Offline eval</text><text class="dg-s" x="623.9" y="91.9" text-anchor="middle">AUC, calibration</text></g><g class="dg-n dg-t-blue" data-id="register"><path class="dg-sh" d="M557.4,209 A66.5,7 0 0 1 690.4,209 V261 A66.5,7 0 0 1 557.4,261 Z"/><path class="dg-sh2" d="M557.4,209 A66.5,7 0 0 0 690.4,209"/><text class="dg-l" x="623.9" y="234.6" text-anchor="middle">Model registry</text><text class="dg-s" x="623.9" y="250.4" text-anchor="middle">stage = production</text></g><g class="dg-n dg-t-plain" data-id="deploy"><rect class="dg-sh" x="268" y="210" width="147" height="50" rx="8"/><text class="dg-l" x="341.5" y="231.1" text-anchor="middle">Batch scoring</text><text class="dg-s" x="341.5" y="246.9" text-anchor="middle">nightly, all customers</text></g><g class="dg-n dg-t-soft dg-dash" data-id="monitor"><rect class="dg-sh" x="75.5" y="210" width="127" height="50" rx="8"/><text class="dg-l" x="139" y="231.1" text-anchor="middle">Monitor</text><text class="dg-s" x="139" y="246.9" text-anchor="middle">drift, precision@k</text></g><g class="dg-lb"><rect x="431.5" y="131" width="102.4" height="16" rx="3"/><text x="482.7" y="142.8" text-anchor="middle">AUC below 0.80</text></g><g class="dg-lb"><rect x="42" y="126.2" width="82.6" height="16" rx="3"/><text x="83.3" y="138.1" text-anchor="middle">drift alert</text></g><g class="dg-n dg-t-plain"><rect class="dg-sh" x="17" y="317" width="18" height="12" rx="2"/></g><text class="dg-lg" x="42" y="327">step</text><g class="dg-n dg-t-lav"><rect class="dg-sh" x="87.4" y="317" width="18" height="12" rx="2"/></g><text class="dg-lg" x="112.4" y="327">model</text><g class="dg-n dg-t-amber"><rect class="dg-sh" x="164.4" y="317" width="18" height="12" rx="2"/></g><text class="dg-lg" x="189.4" y="327">guardrail</text><g class="dg-n dg-t-blue"><rect class="dg-sh" x="267.8" y="317" width="18" height="12" rx="2"/></g><text class="dg-lg" x="292.8" y="327">store</text><g class="dg-n dg-t-soft"><rect class="dg-sh" x="344.8" y="317" width="18" height="12" rx="2"/></g><text class="dg-lg" x="369.8" y="327">monitoring</text><path class="dg-e dashed c-blue" d="M453.8,323 H473.8"/><text class="dg-lg" x="479.8" y="327">feedback loop</text></g><text class="dg-key" x="16" y="394">Key: Box = stage (tool in the sub line) · cylinder = store · hexagon = gate · dashed blue = feedback</text><text class="dg-key" x="16" y="410">loop that retrains</text><text class="dg-notice" x="16" y="431">Notice: Two loops retrain the model: a failed offline eval goes straight back to training, a drift alert rebuilds the</text><text class="dg-notice" x="16" y="449">training set.</text></svg>