>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n\u003c/main>\n\u003cscript>/* canvas guard: a frame never navigates or opens windows */addEventListener('click',e=>{if(e.target.closest('a[href]'))e.preventDefault();},true);addEventListener('submit',e=>e.preventDefault(),true);window.open=()=>null;\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"key": "C", "name": "Timeline", "screen": "Run", "pitch": "time is the axis on every screen; late and overlapping runs only show on a time axis", "file": "c-run.html", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>C \u00b7 Timeline \u00b7 Run\u003c/title>\n\u003cstyle>/* Design tokens: run-monitor. One line per token, both themes through light-dark(); the canvas and screenshot.py set data-theme.\n   Names are the contract with check_design.py (contrast pairs) and the canvas (knobs). Add tokens, do not rename these. */\n:root {\n  color-scheme: light dark;\n\n  /* knobs: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-md)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);\n           padding: 0 var(--space-3); min-height: 36px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }\n  button.quiet { border-color: transparent; color: var(--ink-2); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); }\n  header strong { font-size: var(--text-lg); letter-spacing: var(--tracking-tight); }\n  header nav { display: flex; gap: var(--space-1); overflow-x: auto; }\n  header nav a { color: var(--ink-2); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }\n  header nav a[aria-current] { color: var(--ink); background: var(--surface-2); }\n  header .primary { margin-left: auto; white-space: nowrap; }\n\n  main { padding: var(--space-5); display: grid; gap: var(--space-4); max-width: 1400px; margin: 0 auto; }\n  .back { color: var(--ink-2); text-decoration: none; font-size: var(--text-sm); display: inline-block; min-height: 24px; line-height: 24px; }\n  h1 { margin: 0; font-size: var(--text-xl); letter-spacing: var(--tracking-tight); display: flex; gap: var(--space-3); align-items: baseline; flex-wrap: wrap; }\n  h1 small { font-size: var(--text-sm); color: var(--ink-2); font-weight: 400; }\n  h1 .fail-text { color: var(--danger-text); }\n  .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }\n  .actions .quiet { margin-left: auto; }\n\n  /* the run's stages on the same hour axis as the day grid: 14:00 to 15:00, one column per 5 minutes */\n  .gantt { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }\n  table { border-collapse: collapse; min-width: 900px; width: 100%; }\n  th, td { padding: 0; border-bottom: 1px solid var(--border); }\n  th { font-weight: 500; color: var(--ink-2); font-size: var(--text-xs); text-align: left; padding: var(--space-2) var(--space-3); background: var(--surface-2); }\n  th.t { text-align: center; padding: var(--space-2) 0; min-width: 56px; }\n  td.name { padding: 0 var(--space-3); white-space: nowrap; font-size: var(--text-sm); width: 200px; position: sticky; left: 0; background: var(--surface); }\n  td.name small { display: block; color: var(--ink-2); font-size: var(--text-xs); }\n  td.lane { position: relative; height: 44px; }\n  td.lane > span { position: absolute; top: 8px; height: 28px; border-radius: var(--radius-sm); font: var(--text-xs)/28px var(--font-mono); padding: 0 var(--space-2); white-space: nowrap; }\n  .ok { background: var(--ok-soft); color: var(--ok-text); } .fail { background: var(--danger); color: var(--danger-ink); }\n  .ghost { position: absolute; top: 8px; height: 28px; border: 1px dashed var(--ink-3); border-radius: var(--radius-sm); }\n  .now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); }\n  .legend { display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--ink-2); flex-wrap: wrap; }\n  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: var(--radius-sm); vertical-align: -2px; margin-right: 6px; }\n  .legend i.g { border: 1px dashed var(--ink-3); }\n  pre { margin: 0; padding: var(--space-3) var(--space-4); background: var(--danger-soft); color: var(--danger-text); border-radius: var(--radius-md); font: var(--text-sm)/1.5 var(--font-mono); white-space: pre-wrap; max-width: 920px; }\n\n  @media (max-width: 719px) { main { padding: var(--space-4); } header nav { display: none; } .actions button { min-height: 44px; flex: 1; } .actions .quiet { margin: 0; } td.name { width: 130px; } }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"C\" data-name=\"Timeline\" data-screen=\"Run\" data-pitch=\"time is the axis on every screen; late and overlapping runs only show on a time axis\">\n\u003cheader>\n  \u003cstrong>Run monitor\u003c/strong>\n  \u003cnav aria-label=\"Main\">\u003ca href=\"#\" aria-current=\"page\">Runs\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\u003c/nav>\n  \u003cbutton class=\"primary\">Open 3 failed\u003c/button>\n\u003c/header>\n\u003cmain>\n  \u003ca class=\"back\" href=\"#\">\u2190 Today\u003c/a>\n  \u003ch1>events_hourly \u003cspan class=\"mono\">#4a1f\u003c/span> \u003cspan class=\"fail-text\">failed 13:30\u003c/span> \u003csmall>started 13:05 by schedule \u00b7 25 min, p50 6 min \u00b7 owner platform-b\u003c/small>\u003c/h1>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"ok\">\u003c/i>stage ok\u003c/span>\u003cspan>\u003ci class=\"fail\">\u003c/i>stage failed\u003c/span>\u003cspan>\u003ci class=\"g\">\u003c/i>usual duration (p50)\u003c/span>\u003cspan>the 13:00 hour\u003c/span>\u003c/div>\n  \u003cdiv class=\"gantt\">\n    \u003ctable aria-label=\"Stages of run 4a1f on the 13:00 hour axis\">\n      \u003cthead>\u003ctr>\u003cth>Stage\u003c/th>\u003cth class=\"t\">13:00\u003c/th>\u003cth class=\"t\">:05\u003c/th>\u003cth class=\"t\">:10\u003c/th>\u003cth class=\"t\">:15\u003c/th>\u003cth class=\"t\">:20\u003c/th>\u003cth class=\"t\">:25\u003c/th>\u003cth class=\"t\">:30\u003c/th>\u003cth class=\"t\">:35\u003c/th>\u003cth class=\"t\">:40\u003c/th>\u003cth class=\"t\">:45\u003c/th>\u003cth class=\"t\">:50\u003c/th>\u003cth class=\"t\">:55\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd class=\"name\">extract_events\u003csmall>3 min \u00b7 ok\u003c/small>\u003c/td>\u003ctd class=\"lane\" colspan=\"12\">\u003cspan class=\"ok\" style=\"left:8.3%;width:5%\">3m\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"name\">stage_to_parquet\u003csmall>7 min \u00b7 ok, usually 4\u003c/small>\u003c/td>\u003ctd class=\"lane\" colspan=\"12\">\u003cspan class=\"ghost\" style=\"left:13.3%;width:6.7%\">\u003c/span>\u003cspan class=\"ok\" style=\"left:13.3%;width:11.7%\">7m\u003c/span>\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd class=\"name\">load_events\u003csmall>15 min \u00b7 timeout, usually 1\u003c/small>\u003c/td>\u003ctd class=\"lane\" colspan=\"12\">\u003cspan class=\"ghost\" style=\"left:25%;width:1.7%\">\u003c/span>\u003cspan class=\"fail\" style=\"left:25%;width:25%\">15m \u00b7 timeout at 13:30\u003c/span>\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/div>\n  \u003cpre>Timeout after 25 min in stage load_events\n1.9 GB staged, 0 rows loaded \u00b7 warehouse queue was 4 deep at 13:10\u003c/pre>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"primary\">Retry run\u003c/button>\u003cbutton>Open full log\u003c/button>\u003cbutton>Mute alerts 2 h\u003c/button>\u003cbutton class=\"quiet\">Delete run\u2026\u003c/button>\u003c/div>\n\u003c/main>\n\u003cscript>/* canvas guard: a frame never navigates or opens windows */addEventListener('click',e=>{if(e.target.closest('a[href]'))e.preventDefault();},true);addEventListener('submit',e=>e.preventDefault(),true);window.open=()=>null;\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"key": "System", "name": "Tokens", "screen": "", "pitch": "generated from tokens.css", "file": "tokens.css", "html": "\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>System\u003c/title>\u003cstyle>/* Design tokens: run-monitor. One line per token, both themes through light-dark(); the canvas and screenshot.py set data-theme.\n   Names are the contract with check_design.py (contrast pairs) and the canvas (knobs). Add tokens, do not rename these. */\n:root {\n  color-scheme: light dark;\n\n  /* knobs: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\nbody{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:var(--font-size-base,15px)/1.5 var(--font-sans,system-ui)}\nh2{font-size:var(--text-sm,13px);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin:24px 0 8px}\n.sw{display:flex;align-items:center;gap:10px;margin:4px 0}.sw i{width:28px;height:28px;border-radius:6px;border:1px solid var(--border)}\n.sw small{color:var(--ink-2)}.sp{display:flex;gap:10px;align-items:center;margin:4px 0}.sp b{height:12px;background:var(--accent)}\n.rd{display:inline-block;width:110px;height:56px;border:1px solid var(--border);background:var(--surface);margin:4px;padding:6px}\ncode{font:12px var(--font-mono,monospace)}\u003c/style>\u003c/head>\u003cbody>\u003ch1 style=\"margin:0;font-size:var(--text-xl,22px)\">Tokens\u003c/h1>\n\u003ch2>Colour\u003c/h2>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--bg)\">\u003c/i>\u003ccode>--bg\u003c/code>\u003csmall>light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--surface)\">\u003c/i>\u003ccode>--surface\u003c/code>\u003csmall>light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--surface-2)\">\u003c/i>\u003ccode>--surface-2\u003c/code>\u003csmall>light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--border)\">\u003c/i>\u003ccode>--border\u003c/code>\u003csmall>light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--border-strong)\">\u003c/i>\u003ccode>--border-strong\u003c/code>\u003csmall>light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ink)\">\u003c/i>\u003ccode>--ink\u003c/code>\u003csmall>light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ink-2)\">\u003c/i>\u003ccode>--ink-2\u003c/code>\u003csmall>light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ink-3)\">\u003c/i>\u003ccode>--ink-3\u003c/code>\u003csmall>light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--accent)\">\u003c/i>\u003ccode>--accent\u003c/code>\u003csmall>light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--accent-ink)\">\u003c/i>\u003ccode>--accent-ink\u003c/code>\u003csmall>light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--accent-soft)\">\u003c/i>\u003ccode>--accent-soft\u003c/code>\u003csmall>light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--focus)\">\u003c/i>\u003ccode>--focus\u003c/code>\u003csmall>var(--accent)\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ok)\">\u003c/i>\u003ccode>--ok\u003c/code>\u003csmall>light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ok-soft)\">\u003c/i>\u003ccode>--ok-soft\u003c/code>\u003csmall>light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ok-text)\">\u003c/i>\u003ccode>--ok-text\u003c/code>\u003csmall>light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--ok-ink)\">\u003c/i>\u003ccode>--ok-ink\u003c/code>\u003csmall>light-dark(oklch(99% 0 0),      oklch(16% 0.04 150))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--warn)\">\u003c/i>\u003ccode>--warn\u003c/code>\u003csmall>light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--warn-soft)\">\u003c/i>\u003ccode>--warn-soft\u003c/code>\u003csmall>light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--warn-text)\">\u003c/i>\u003ccode>--warn-text\u003c/code>\u003csmall>light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--warn-ink)\">\u003c/i>\u003ccode>--warn-ink\u003c/code>\u003csmall>light-dark(oklch(99% 0 0),      oklch(18% 0.05 75))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--danger)\">\u003c/i>\u003ccode>--danger\u003c/code>\u003csmall>light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--danger-soft)\">\u003c/i>\u003ccode>--danger-soft\u003c/code>\u003csmall>light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--danger-text)\">\u003c/i>\u003ccode>--danger-text\u003c/code>\u003csmall>light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--danger-ink)\">\u003c/i>\u003ccode>--danger-ink\u003c/code>\u003csmall>light-dark(oklch(99% 0 0),      oklch(16% 0.05 25))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--info)\">\u003c/i>\u003ccode>--info\u003c/code>\u003csmall>light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--info-soft)\">\u003c/i>\u003ccode>--info-soft\u003c/code>\u003csmall>light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--info-text)\">\u003c/i>\u003ccode>--info-text\u003c/code>\u003csmall>light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240))\u003c/small>\u003c/div>\u003cdiv class=\"sw\">\u003ci style=\"background:var(--info-ink)\">\u003c/i>\u003ccode>--info-ink\u003c/code>\u003csmall>light-dark(oklch(99% 0 0),      oklch(16% 0.04 240))\u003c/small>\u003c/div>\u003ch2>Type\u003c/h2>\u003cp style=\"font-size:var(--text-xs);margin:0 0 8px\">\u003ccode>--text-xs\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-sm);margin:0 0 8px\">\u003ccode>--text-sm\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-md);margin:0 0 8px\">\u003ccode>--text-md\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-lg);margin:0 0 8px\">\u003ccode>--text-lg\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-xl);margin:0 0 8px\">\u003ccode>--text-xl\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-2xl);margin:0 0 8px\">\u003ccode>--text-2xl\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003cp style=\"font-size:var(--text-3xl);margin:0 0 8px\">\u003ccode>--text-3xl\u003c/code> The quick brown fox jumps over 13 lazy dogs\u003c/p>\u003ch2>Spacing\u003c/h2>\u003cdiv class=\"sp\">\u003ccode>--space-1\u003c/code>\u003cb style=\"width:var(--space-1)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-2\u003c/code>\u003cb style=\"width:var(--space-2)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-3\u003c/code>\u003cb style=\"width:var(--space-3)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-4\u003c/code>\u003cb style=\"width:var(--space-4)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-5\u003c/code>\u003cb style=\"width:var(--space-5)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-6\u003c/code>\u003cb style=\"width:var(--space-6)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-7\u003c/code>\u003cb style=\"width:var(--space-7)\">\u003c/b>\u003c/div>\u003cdiv class=\"sp\">\u003ccode>--space-8\u003c/code>\u003cb style=\"width:var(--space-8)\">\u003c/b>\u003c/div>\u003ch2>Radius\u003c/h2>\u003cdiv class=\"rd\" style=\"border-radius:var(--radius)\">\u003ccode>--radius\u003c/code>\u003c/div>\u003cdiv class=\"rd\" style=\"border-radius:var(--radius-sm)\">\u003ccode>--radius-sm\u003c/code>\u003c/div>\u003cdiv class=\"rd\" style=\"border-radius:var(--radius-md)\">\u003ccode>--radius-md\u003c/code>\u003c/div>\u003cdiv class=\"rd\" style=\"border-radius:var(--radius-lg)\">\u003ccode>--radius-lg\u003c/code>\u003c/div>\u003cdiv class=\"rd\" style=\"border-radius:var(--radius-full)\">\u003ccode>--radius-full\u003c/code>\u003c/div>\u003ch2>Elevation\u003c/h2>\u003cdiv class=\"rd\" style=\"box-shadow:var(--shadow-1);border:0\">\u003ccode>--shadow-1\u003c/code>\u003c/div>\u003cdiv class=\"rd\" style=\"box-shadow:var(--shadow-2);border:0\">\u003ccode>--shadow-2\u003c/code>\u003c/div>\u003c/body>\u003c/html>"}];
const KEY = "canvas:" + location.pathname;
const state = { vp: [1280, 800], theme: "light", zoom: "fit", tweaks: {} };
let saved = { notes: {}, picks: [], hidden: ["System"] };
try { saved = Object.assign(saved, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const frameId = (f) => f.key + "/" + (f.file || f.screen);
const keys = [...new Set(FRAMES.map((f) => f.key))];
const isDesign = (k) => !FRAMES.some((f) => f.key === k && !f.missing && !f.file.endsWith(".html"));

function build() {
  const grid = document.getElementById("grid");
  grid.style.gridTemplateColumns = `repeat(${keys.length}, max-content)`;
  for (const k of keys) {
    const col = document.createElement("section"); col.className = "col"; col.dataset.key = k;
    const frames = FRAMES.filter((f) => f.key === k);
    const title = k === "System" || !isDesign(k) ? k : "Direction " + k;
    const sub = [frames[0].name !== k ? frames[0].name : "", frames[0].pitch].filter(Boolean).join(" · ");
    col.innerHTML = `<h2><span>${esc(title)} <small>${esc(sub)}</small></span>${isDesign(k) && k !== "System" ? `<button class="pick" aria-pressed="${saved.picks.includes(k)}">Pick</button>` : ""}</h2>`;
    const pick = col.querySelector(".pick");
    if (pick) pick.onclick = () => { saved.picks = saved.picks.includes(k) ? saved.picks.filter((x) => x !== k) : [...saved.picks, k]; pick.setAttribute("aria-pressed", saved.picks.includes(k)); persist(); };
    for (const f of frames) {
      const box = document.createElement("article"); box.className = "frame";
      const label = esc(k + " " + (f.screen || f.name));
      box.innerHTML = f.missing
        ? `<h3><span>${esc(f.screen)}</span><code>no frame</code></h3><div class="view missing">no ${esc(f.screen)} screen in ${esc(k)}</div>`
        : `<h3><span>${esc(f.screen || f.name)}</span><code>${esc(f.file)}</code></h3><div class="view"><iframe title="${label}"></iframe></div>
           <textarea placeholder="Notes on this frame" aria-label="Notes on ${label}"></textarea>`;
      if (!f.missing) {
        box.querySelector("iframe").srcdoc = f.html;
        const ta = box.querySelector("textarea");
        ta.value = saved.notes[frameId(f)] || "";
        ta.oninput = () => { saved.notes[frameId(f)] = ta.value; persist(); };
      }
      col.appendChild(box);
    }
    col.hidden = saved.hidden.includes(k);
    grid.appendChild(col);
    const lab = document.createElement("label"); lab.className = "show";
    lab.innerHTML = `<input type="checkbox" ${col.hidden ? "" : "checked"}> ${esc(k)}`;
    lab.querySelector("input").onchange = (e) => { col.hidden = !e.target.checked; saved.hidden = keys.filter((x) => document.querySelector(`.col[data-key="${CSS.escape(x)}"]`).hidden); persist(); apply(); };
    document.getElementById("columns").appendChild(lab);
  }
}

const docs = () => [...document.querySelectorAll(".col:not([hidden]) iframe")].map((i) => i.contentDocument).filter(Boolean);

function apply() {
  const [w, h] = state.vp;
  const width = (k) => (k === "System" ? Math.min(w, 640) : w);
  const shown = keys.filter((k) => !document.querySelector(`.col[data-key="${CSS.escape(k)}"]`).hidden);
  const total = shown.reduce((s, k) => s + width(k), 0) || w;
  const z = state.zoom === "fit" ? Math.max(0.2, Math.min(1, (innerWidth - 28 - 44 * shown.length) / total)) : +state.zoom;
  for (const v of document.querySelectorAll(".view")) {
    const fw = width(v.closest(".col").dataset.key), i = v.querySelector("iframe");
    v.style.width = Math.round(fw * z) + "px"; v.style.height = Math.round(h * z) + "px";
    if (i) { i.style.width = fw + "px"; i.style.height = h + "px"; i.style.transform = `scale(${z})`; }
  }
  document.documentElement.dataset.theme = state.theme;
  for (const d of document.querySelectorAll("iframe")) {
    const doc = d.contentDocument; if (!doc) continue;
    doc.documentElement.dataset.theme = state.theme;
    doc.documentElement.removeAttribute("style");
    for (const [k, val] of Object.entries(state.tweaks)) doc.documentElement.style.setProperty(k, val);
  }
  document.getElementById("status").textContent = `${w}×${h} · ${state.theme} · ${Math.round(z * 100)}%`;
}

function readKnobDefaults() {
  const d = docs().find((x) => x.body && x.body.textContent.trim());
  if (!d) return;
  const cs = getComputedStyle(d.documentElement);
  for (const inp of document.querySelectorAll("#knobs input")) {
    const v = parseFloat(cs.getPropertyValue(inp.dataset.var));
    inp.disabled = isNaN(v);  /* the token file has no such knob: the slider cannot work */
    if (!isNaN(v)) inp.value = v;
    inp.nextElementSibling.value = isNaN(v) ? "n/a" : inp.value + inp.dataset.unit;
  }
}

function exportText() {
  const lines = [`# Canvas notes · ${document.title.replace("Canvas · ", "")}`, `View: ${document.getElementById("status").textContent}`];
  lines.push(`Picked: ${saved.picks.join(", ") || "none"}`);
  lines.push(`Tweaks: ${Object.entries(state.tweaks).map(([k, v]) => `${k}: ${v};`).join(" ") || "none"}`, "");
  for (const f of FRAMES) {
    const n = (saved.notes[frameId(f)] || "").trim();
    if (n) lines.push(`## ${f.key} — ${f.name}${f.screen ? " / " + f.screen : ""} (${f.file})`, n, "");
  }
  return lines.join("\n");
}

const press = (b) => { for (const x of b.parentElement.querySelectorAll("button")) x.setAttribute("aria-pressed", x === b); };
document.querySelectorAll("[data-vp]").forEach((b) => b.onclick = () => { state.vp = b.dataset.vp.split("x").map(Number); press(b); apply(); });
document.querySelectorAll("[data-theme]").forEach((b) => b.onclick = () => { state.theme = b.dataset.theme; press(b); apply(); });
document.getElementById("zoom").onchange = (e) => { state.zoom = e.target.value; apply(); };
document.querySelectorAll("#knobs input").forEach((inp) => inp.oninput = () => {
  state.tweaks[inp.dataset.var] = inp.value + inp.dataset.unit; inp.nextElementSibling.value = inp.value + inp.dataset.unit; apply();
});
document.getElementById("reset").onclick = () => { state.tweaks = {}; apply(); readKnobDefaults(); };
document.getElementById("export").onclick = () => {
  const t = exportText(); document.getElementById("exportText").value = t;
  document.getElementById("dl").href = URL.createObjectURL(new Blob([t], { type: "text/markdown" }));
  document.getElementById("dlg").showModal();
};
document.getElementById("copy").onclick = async () => {
  const ta = document.getElementById("exportText");
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand("copy"); }
  document.getElementById("status").textContent = "copied";
};
document.getElementById("close").onclick = () => document.getElementById("dlg").close();
addEventListener("resize", () => { if (state.zoom === "fit") apply(); });

build();
let pending = document.querySelectorAll("iframe").length;
document.querySelectorAll("iframe").forEach((i) => i.addEventListener("load", () => { if (--pending === 0) { apply(); readKnobDefaults(); } }));
apply();
</script>
</body>
</html>
