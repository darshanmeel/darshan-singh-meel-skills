<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas · run-monitor · round-1</title>
<style>
  /* the canvas chrome is deliberately plain and grey so the directions carry all the colour */
  :root { --c-bg: #e9e9ec; --c-panel: #fafafa; --c-ink: #1b1b1f; --c-ink2: #55555f; --c-line: #c4c4cc; --c-acc: #1f4fd8; --c-acc-ink: #ffffff; }
  :root[data-theme="dark"] { --c-bg: #202024; --c-panel: #2b2b31; --c-ink: #ececf1; --c-ink2: #b0b0ba; --c-line: #4a4a54; --c-acc: #9fbbff; --c-acc-ink: #10203f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; max-width: 100vw; overflow-x: hidden; }
  body { background: var(--c-bg); color: var(--c-ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center;
           padding: 8px 14px; background: var(--c-panel); border-bottom: 1px solid var(--c-line); }
  header h1 { font-size: 13px; font-weight: 600; margin: 0 8px 0 0; }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .grp > span { color: var(--c-ink2); }
  button, select, .btn { font: inherit; color: inherit; background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 6px;
                         padding: 4px 9px; cursor: pointer; min-height: 28px; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed="true"] { background: var(--c-acc); color: var(--c-acc-ink); border-color: var(--c-acc); }
  :focus-visible { outline: 2px solid var(--c-acc); outline-offset: 2px; }
  label.knob { display: inline-flex; align-items: center; gap: 5px; color: var(--c-ink2); }
  label.knob input { width: 90px; height: 24px; }
  label.knob output { min-width: 3.5em; color: var(--c-ink); font-variant-numeric: tabular-nums; }
  label.show { display: inline-flex; align-items: center; gap: 4px; }
  label.show input { width: 24px; height: 24px; margin: 0; }
  input { accent-color: var(--c-acc); }
  ::placeholder { color: var(--c-ink2); }
  main { padding: 18px 14px 40px; overflow: auto; }
  #grid { display: grid; gap: 22px; align-items: start; width: max-content; }
  .col { display: grid; gap: 18px; }
  .col[hidden] { display: none; }
  .col > h2 { margin: 0; font-size: 15px; display: flex; gap: 10px; align-items: baseline; width: 0; min-width: 100%; }  /* never widens the column */
  .col > h2 small { font-weight: 400; color: var(--c-ink2); }
  .col > h2 button { margin-left: auto; font-size: 12px; min-height: 24px; padding: 2px 8px; }
  .frame { background: var(--c-panel); border: 1px solid var(--c-line); border-radius: 8px; padding: 10px; }
  .frame h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--c-ink2); display: flex; justify-content: space-between; gap: 8px; }
  .frame h3 code { font: 12px ui-monospace, monospace; }
  .view { overflow: hidden; border: 1px solid var(--c-line); background: #fff; }
  .view iframe { border: 0; display: block; transform-origin: 0 0; }
  .view.missing { display: grid; place-items: center; color: var(--c-ink2); border-style: dashed; background: transparent; }
  .frame textarea { width: 100%; margin-top: 8px; min-height: 54px; resize: vertical; font: inherit; color: inherit;
                    background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 6px; padding: 6px 8px; }
  dialog { max-width: 720px; width: 90vw; border: 1px solid var(--c-line); border-radius: 8px; background: var(--c-panel); color: inherit; }
  dialog textarea { width: 100%; height: 50vh; font: 12px ui-monospace, monospace; }
  #status { color: var(--c-ink2); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>run-monitor · round-1</h1>
  <div class="grp" role="group" aria-label="Viewport"><span>Viewport</span>
    <button data-vp="1280x800" aria-pressed="true">Desktop</button><button data-vp="834x1112">Tablet</button><button data-vp="390x844">Mobile</button>
  </div>
  <div class="grp" role="group" aria-label="Theme"><span>Theme</span>
    <button data-theme="light" aria-pressed="true">Light</button><button data-theme="dark">Dark</button>
  </div>
  <div class="grp"><span>Zoom</span>
    <select id="zoom" aria-label="Zoom"><option value="fit" selected>Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select>
  </div>
  <div class="grp" id="columns" role="group" aria-label="Columns"><span>Show</span></div>
  <div class="grp" id="knobs">
    <label class="knob">Hue <input type="range" min="0" max="360" step="1" data-var="--accent-h" data-unit=""><output></output></label>
    <label class="knob">Radius <input type="range" min="0" max="24" step="1" data-var="--radius" data-unit="px"><output></output></label>
    <label class="knob">Density <input type="range" min="0.8" max="1.25" step="0.05" data-var="--density" data-unit=""><output></output></label>
    <label class="knob">Base size <input type="range" min="13" max="18" step="0.5" data-var="--font-size-base" data-unit="px"><output></output></label>
    <button id="reset">Reset</button>
  </div>
  <div class="grp"><button id="export">Export notes</button></div>
  <span id="status" aria-live="polite"></span>
</header>
<main><div id="grid"></div></main>

<dialog id="dlg">
  <p style="margin:0 0 8px">Picks, notes, tweaks and the view, as text. Copy it, or save it as <code>comments.md</code> next to this canvas.</p>
  <textarea id="exportText" aria-label="Export"></textarea>
  <div class="grp" style="margin-top:8px;justify-content:flex-end"><button id="copy">Copy</button><a id="dl" class="btn" download="comments.md">Download</a><button id="close">Close</button></div>
</dialog>

CAXBGAAAAByQQAGAAAgFwRgAAAAckEABgAAIBf+fwAAAP//LZ3tBQAAAAZJREFUAwBkacCRCdKPCQAAAABJRU5ErkJggg==\" alt=\"Before: run\" style=\"width:100%;display:block\">\u003c/body>\u003c/html>"}, {"key": "A", "name": "Triage first", "screen": "Runs", "pitch": "failures are the job; the headline reads like an incident line and every failure carries its 24 h strip", "file": "a-runs.html", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>A \u00b7 Triage first \u00b7 Runs\u003c/title>\n\u003cstyle>/* Design tokens: run-monitor. One line per token, both themes through light-dark(); the canvas and screenshot.py set data-theme.\n   Names are the contract with check_design.py (contrast pairs) and the canvas (knobs). Add tokens, do not rename these. */\n:root {\n  color-scheme: light dark;\n\n  /* knobs: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-md)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);\n           padding: 0 var(--space-3); min-height: 36px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n  button.primary:hover { filter: brightness(1.08); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--border); background: var(--surface); }\n  header strong { font-size: var(--text-lg); letter-spacing: var(--tracking-tight); }\n  header nav { display: flex; gap: var(--space-1); margin-left: var(--space-4); overflow-x: auto; }\n  header nav a { color: var(--ink-2); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }\n  header nav a[aria-current] { color: var(--ink); background: var(--surface-2); }\n  header .who { margin-left: auto; color: var(--ink-2); font-size: var(--text-sm); white-space: nowrap; }\n\n  main { max-width: 1180px; margin: 0 auto; padding: var(--space-5); display: grid; gap: var(--space-5); }\n  /* the memorable element: the situation as a sentence, set in the display serif */\n  h1 { margin: 0; font: 400 var(--text-3xl)/var(--leading-tight) var(--font-display); letter-spacing: var(--tracking-tight); }\n  h1 small { display: block; font: var(--text-sm)/var(--leading) var(--font-sans); color: var(--ink-2); margin-top: var(--space-2); }\n\n  .fails { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: var(--space-3); }\n  /* the card's head is the pipeline's last 24 runs at full width: the one box that differs is why the card exists */\n  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 0 var(--space-3); display: grid; gap: var(--space-2); align-content: start; overflow: hidden; }\n  .card > * { margin: 0 var(--space-4); }\n  .card .strip { margin: 0; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 32px; padding: var(--space-1) var(--space-1) 0; background: var(--surface-2); }\n  .card .strip i { background: var(--ok-soft); border-radius: var(--radius-sm) var(--radius-sm) 0 0; margin-top: 14px; }\n  .card .strip i.f { background: var(--danger); margin-top: 0; }\n  .card .strip i.l { background: var(--warn); margin-top: 0; }\n  .card h2 { font-size: var(--text-lg); display: flex; justify-content: space-between; gap: var(--space-2); align-items: baseline; margin-top: var(--space-2); }\n  .card .cap { color: var(--ink-2); font-size: var(--text-xs); }\n  .card pre { padding: var(--space-2) var(--space-3); background: var(--danger-soft); color: var(--danger-text); border-radius: var(--radius-sm); font: var(--text-sm)/1.45 var(--font-mono); white-space: pre-wrap; }\n  .card.late pre { background: transparent; color: var(--warn-text); padding: 0; }\n  .card .meta { color: var(--ink-2); font-size: var(--text-sm); }\n  .card .row { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }\n  .card .row button { white-space: nowrap; }\n\n  section h2 { font-size: var(--text-sm); color: var(--ink-2); font-weight: 500; margin: 0 0 var(--space-2); }\n  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }\n  th, td { text-align: left; padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); font-size: var(--text-sm); }\n  th { border-top: 0; color: var(--ink-2); font-weight: 500; background: var(--surface-2); }\n  td.num, th.num { text-align: right; }\n  tr:hover td { background: var(--surface-2); }\n  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px var(--space-2); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 500; }\n  .badge::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }\n  .ok { background: var(--ok-soft); color: var(--ok-text); } .run { background: var(--info-soft); color: var(--info-text); }\n\n  @media (max-width: 719px) {\n    header .who { display: none; }  /* the nav keeps its room; the on-call team is one tap away in Alerts */\n    main { padding: var(--space-4); }\n    h1 { font-size: var(--text-2xl); }\n    .card .row button { min-height: 44px; flex: 1 1 100%; }\n    .card h2 { flex-direction: column; align-items: flex-start; gap: 0; }  /* state on its own line: no mid-phrase wrap */\n    table thead { display: none; }\n    table, tbody, tr, td { display: block; border: 0; }\n    tr { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; }\n    td { padding: 0; border: 0; }\n    td.num { text-align: right; color: var(--ink-2); }\n    td:nth-child(3), td:nth-child(5) { display: none; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"A\" data-name=\"Triage first\" data-screen=\"Runs\" data-pitch=\"failures are the job; the headline reads like an incident line and every failure carries its 24 h strip\">\n\u003cheader>\n  \u003cstrong>Runs\u003c/strong>\n  \u003cnav aria-label=\"Main\">\u003ca href=\"#\" aria-current=\"page\">Last 24 h\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\u003c/nav>\n  \u003cspan class=\"who\">on call: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-md)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);\n           padding: 0 var(--space-3); min-height: 36px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n  button.quiet { border-color: transparent; color: var(--ink-2); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) lute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: var(--radius-sm); }\n  .stage .bar i.f { background: var(--danger); }\n  .stage .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3); }\n  .stage .dur { text-align: right; }\n  .legend { color: var(--ink-2); font-size: var(--text-xs); }\n  dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); margin: 0; font-size: var(--text-sm); }\n  dt { color: var(--ink-2); } dd { margin: 0; }\n  .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }\n\n  @media (max-width: 719px) {\n    header .who { display: none; }  /* the nav keeps its room; the on-call team is one tap away in Alerts */\n    main { padding: var(--space-4); }\n    h1 { font-size: var(--text-2xl); }\n    .actions button { min-height: 44px; flex: 1; } .actions .quiet { margin: 0; }\n    .stage { grid-template-columns: 1fr auto; } .stage .bar { grid-column: 1 / -1; }\n    .two { grid-template-columns: 1fr; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"A\" data-name=\"Triage first\" data-screen=\"Run\" data-pitch=\"failures are the job; the headline reads like an incident line and every failure carries its 24 h strip\">\n\u003cheader>\n  \u003cstrong>Runs\u003c/strong>\n  \u003cnav aria-label=\"Main\">\u003ca href=\"#\" aria-current=\"page\">Last 24 h\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\u003c/nav>\n  \u003cspan class=\"who\">on call: platform-b \u00b7 14:32\u003c/span>\n\u003c/header>\n\u003cmain>\n  \u003ca class=\"back\" href=\"#\">\u2190 Runs, last 24 h\u003c/a>\n  \u003ch1>events_hourly failed at 13:30 after 25 min. \u003csmall>run \u003cspan class=\"mono\">#4a1f\u003c/span> \u00b7 started 13:05 by schedule \u00b7 p50 is 6 min \u00b7 owner platform-b\u003c/small>\u003c/h1>\n  \u003cpre class=\"error\">Timeout after 25 min in stage load_events\n1.9 GB staged, 0 rows loaded \u00b7 warehouse queue was 4 deep at 13:10\u003c/pre>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"primary\">Retry run\u003c/button>\u003cbutton>Open full log\u003c/button>\u003cbutton>Mute alerts 2 h\u003c/button>\u003cbutton class=\"quiet\">Delete run\u2026\u003c/button>\u003c/div>\n\n  \u003csection>\n    \u003ch2>Stages \u003cspan class=\"legend\">\u00b7 bar = this run \u00b7 mark = usual (p50)\u003c/span>\u003c/h2>\n    \u003cdiv class=\"stages\">\n      \u003cdiv class=\"stage\">\u003cspan>extract_events\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:20%\">\u003c/i>\u003cb style=\"left:20%\">\u003c/b>\u003c/div>\u003cspan class=\"dur mono\">3 min \u00b7 ok\u003c/span>\u003c/div>\n      \u003cdiv class=\"stage\">\u003cspan>stage_to_parquet\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:47%\">\u003c/i>\u003cb style=\"left:27%\">\u003c/b>\u003c/div>\u003cspan class=\"dur mono\">7 min \u00b7 ok\u003c/span>\u003c/div>\n      \u003cdiv class=\"stage\">\u003cspan>load_events\u003c/span>\u003cdiv class=\"bar\">\u003ci class=\"f\" style=\"width:100%\">\u003c/i>\u003cb style=\"left:7%\">\u003c/b>\u003c/div>\u003cspan class=\"dur mono\">15 min \u00b7 timeout\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"two\">\n    \u003csection>\u003ch2>Facts\u003c/h2>\n      \u003cdl>\u003cdt>Trigger\u003c/dt>\u003cdd>schedule, hourly at :05\u003c/dd>\u003cdt>Attempt\u003c/dt>\u003cdd>1 of 3\u003c/dd>\u003cdt>Cluster\u003c/dt>\u003cdd class=\"mono\">spark-prod-03\u003c/dd>\u003cdt>Input\u003c/dt>\u003cdd>1.9 GB, 14 partitions\u003c/dd>\u003cdt>Previous run\u003c/dt>\u003cdd class=\"mono\">13:00 \u00b7 ok \u00b7 6 min\u003c/dd>\u003c/dl>\n    \u003c/section>\n    \u003csection>\u003ch2>Same failure before\u003c/h2>\n      \u003cdl>\u003cdt>Last timeout\u003c/dt>\u003cdd>9 days ago, same stage, queue 6 deep\u003c/dd>\u003cdt>Fixed by\u003c/dt>\u003cdd>retry after the queue cleared\u003c/dd>\u003c/dl>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>\n\u003cscript>/* canvas guard: a frame never navigates or opens windows */addEventListener('click',e=>{if(e.target.closest('a[href]'))e.preventDefault();},true);addEventListener('submit',e=>e.preventDefault(),true);window.open=()=>null;\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"key": "B", "name": "Dense console", "screen": "Runs", "pitch": "every run at once; the list never leaves: the Run screen is the panel grown wide", "file": "b-runs.html", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>B \u00b7 Dense console \u00b7 Runs\u003c/title>\n\u003cstyle>/* Design tokens: run-monitor. One line per token, both themes through light-dark(); the canvas and screenshot.py set data-theme.\n   Names are the contract with check_design.py (contrast pairs) and the canvas (knobs). Add tokens, do not rename these. */\n:root {\n  color-scheme: light dark;\n\n  /* knobs: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-sm)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);\n           padding: 0 var(--space-3); min-height: 32px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n  input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 var(--space-2); min-height: 32px; accent-color: var(--accent); }\n  ::placeholder { color: var(--ink-2); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  .app { display: grid; grid-template-columns: 200px 1fr 360px; min-height: 100vh; }\n  .rail { background: var(--surface); border-right: 1px solid var(--border); padding: var(--space-3); display: grid; gap: var(--space-1); align-content: start; }\n  .rail strong { padding: var(--space-2); font-size: var(--text-md); letter-spacing: var(--tracking-tight); }\n  .rail a { color: var(--ink-2); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); display: flex; justify-content: space-between; }\n  .rail a[aria-current] { color: var(--ink); background: var(--surface-2); }\n  .rail a b { font-weight: 500; color: var(--danger-text); }\n  .rail h2 { font-size: var(--text-xs); color: var(--ink-2); font-weight: 500; margin: var(--space-3) var(--space-2) var(--space-1); }\n\n  main { display: grid; align-content: start; min-width: 0; }\n  main > h1 { margin: 0; padding: var(--space-3) var(--space-4) 0; font-size: var(--text-lg); letter-spacing: var(--tracking-tight); }\n  .bar { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-2) var(--space-4); align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 1; }\n  .bar input { width: 140px; }\n  .bar .count { margin-left: auto; color: var(--ink-2); }\n  .chip { border: 1px solid var(--border-strong); border-radius: var(--radius-full); padding: 0 var(--space-2); min-height: 28px; background: var(--surface); font: inherit; color: var(--ink); cursor: pointer; }\n  .chip[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n  .scroll { overflow-x: auto; }\n  table { width: 100%; border-collapse: collapse; }\n  th, td { text-align: left; padding: 6px var(--space-3); border-bottom: 1px solid var(--border); white-space: nowrap; }\n  th { position: sticky; top: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 500; font-size: var(--text-xs); }\n  th.num, td.num { text-align: right; }\n  td.msg { max-width: 0; width: 30%; overflow: hidden; text-overflow: ellipsis; }  /* max-width: 0 lets a nowrap cell shrink and ellipsize */\n  tr[aria-selected=\"true\"] td { background: var(--accent-soft); }\n  tbody tr:hover td { background: var(--surface-2); }\n  tbody tr { cursor: pointer; }\n  .st { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-sm); margin-right: 6px; vertical-align: 1px; }\n  .st.ok { background: var(--ok); } .st.fail { background: var(--danger); } .st.run { background: var(--info); } .st.late { background: var(--warn); }\n  td.fail-text { color: var(--danger-text); }\n  .bar-dur { display: inline-block; height: 6px; background: var(--ink-3); vertical-align: middle; border-radius: var(--radius-sm); margin-left: 6px; }\n\n  aside { border-left: 1px solid var(--border); background: var(--surface); padding: var(--space-4); display: grid; gap: var(--space-3); align-content: start; }\n  aside h2 { margin: 0; font-size: var(--text-lg); letter-spacing: var(--tracking-tight); }\n  aside dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3); margin: 0; }\n  aside dt { color: var(--ink-2); } aside dd { margin: 0; }\n  aside pre { margin: 0; padding: var(--space-2) var(--space-3); background: var(--danger-soft); color: var(--danger-text); border-radius: var(--radius-sm); font: var(--text-xs)/1.5 var(--font-mono); white-space: pre-wrap; }\n  aside .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }\n  aside h3 { margin: var(--space-2) 0 0; font-size: var(--text-sm); color: var(--ink-2); font-weight: 500; }\n  .hist { display: flex; gap: 3px; align-items: flex-end; height: 36px; }\n  .hist i { flex: 1; background: var(--ok); border-radius: var(--radius-sm); } .hist i.fail { background: var(--danger); }\n\n  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .rail, aside { display: none; } }\n  @media (max-width: 719px) { td:nth-child(4), th:nth-child(4), td:nth-child(6), th:nth-child(6), .bar-dur { display: none; } .bar .count { width: 100%; margin: 0; } .bar input { flex: 1; } }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"B\" data-name=\"Dense console\" data-screen=\"Runs\" data-pitch=\"every run at once; the list never leaves: the Run screen is the panel grown wide\">\n\u003cdiv class=\"app\">\n  \u003cnav class=\"rail\" aria-label=\"Main\">\n    \u003cstrong>Run monitor\u003c/strong>\n    \u003ca href=\"#\" aria-current=\"page\">Runs \u003cb>3\u003c/b>\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\n    \u003ch2>Teams\u003c/h2>\n    \u003ca href=\"#\">platform-b \u003cb>1\u003c/b>\u003c/a>\u003ca href=\"#\">finance-data \u003cb>1\u003c/b>\u003c/a>\u003ca href=\"#\">growth \u003cb>1\u003c/b>\u003c/a>\u003ca href=\"#\">commerce\u003c/a>\u003ca href=\"#\">supply\u003c/a>\n  \u003c/nav>\n  \u003cmain>\n    \u003ch1>Runs, last 24 h\u003c/h1>\n    \u003cdiv class=\"bar\" role=\"toolbar\" aria-label=\"Filters\">\n      \u003cbutton class=\"chip\" aria-pressed=\"true\">All 41\u003c/button>\u003cbutton class=\"chip\">Failed 3\u003c/button>\u003cbutton class=\"chip\">Running 1\u003c/button>\u003cbutton class=\"chip\">Late 1\u003c/button>\n      \u003cselect aria-label=\"Team\">\u003coption>All teams\u003c/option>\u003coption>platform-b\u003c/option>\u003coption>finance-data\u003c/option>\u003c/select>\n      \u003cinput type=\"search\" placeholder=\"Pipeline\" aria-label=\"Filter by pipeline\">\n      \u003cspan class=\"count\">36 ok \u00b7 3 failed \u00b7 refreshed 20 s ago\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"scroll\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Status\u003c/th>\u003cth>Pipeline\u003c/th>\u003cth>Started\u003c/th>\u003cth>Owner\u003c/th>\u003cth class=\"num\">Duration\u003c/th>\u003cth>Message\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003ci class=\"st run\">\u003c/i>running\u003c/td>\u003ctd>dbt_marts_hourly\u003c/td>\u003ctd class=\"mono\">14:30\u003c/td>\u003ctd>platform-b\u003c/td>\u003ctd class=\"num mono\">2 min\u003ci class=\"bar-dur\" style=\"width:4px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr aria-selected=\"true\">\u003ctd>\u003ci class=\"st fail\">\u003c/i>failed\u003c/td>\u003ctd>events_hourly\u003c/td>\u003ctd class=\"mono\">13:05\u003c/td>\u003ctd>platform-b\u003c/td>\u003ctd class=\"num mono\">25 min\u003ci class=\"bar-dur\" style=\"width:50px\">\u003c/i>\u003c/td>\u003ctd class=\"msg fail-text\">Timeout after 25 min\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>orders_daily\u003c/td>\u003ctd class=\"mono\">14:00\u003c/td>\u003ctd>commerce\u003c/td>\u003ctd class=\"num mono\">11 min\u003ci class=\"bar-dur\" style=\"width:22px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st fail\">\u003c/i>failed\u003c/td>\u003ctd>finance_close_daily\u003c/td>\u003ctd class=\"mono\">13:51\u003c/td>\u003ctd>finance-data\u003c/td>\u003ctd class=\"num mono\">17 min\u003ci class=\"bar-dur\" style=\"width:34px\">\u003c/i>\u003c/td>\u003ctd class=\"msg fail-text\">Numeric value 'N/A' is not recognized\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st late\">\u003c/i>late\u003c/td>\u003ctd>inventory_snapshot\u003c/td>\u003ctd class=\"mono\">13:40\u003c/td>\u003ctd>supply\u003c/td>\u003ctd class=\"num mono\">52 min\u003ci class=\"bar-dur\" style=\"width:104px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">usually 18 min \u00b7 queued\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>events_hourly\u003c/td>\u003ctd class=\"mono\">12:05\u003c/td>\u003ctd>platform-b\u003c/td>\u003ctd class=\"num mono\">6 min\u003ci class=\"bar-dur\" style=\"width:12px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>customer_scd\u003c/td>\u003ctd class=\"mono\">12:30\u003c/td>\u003ctd>growth\u003c/td>\u003ctd class=\"num mono\">4 min\u003ci class=\"bar-dur\" style=\"width:8px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>warehouse_export\u003c/td>\u003ctd class=\"mono\">12:00\u003c/td>\u003ctd>finance-data\u003c/td>\u003ctd class=\"num mono\">23 min\u003ci class=\"bar-dur\" style=\"width:46px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>dbt_marts_hourly\u003c/td>\u003ctd class=\"mono\">11:30\u003c/td>\u003ctd>platform-b\u003c/td>\u003ctd class=\"num mono\">9 min\u003ci class=\"bar-dur\" style=\"width:18px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>events_hourly\u003c/td>\u003ctd class=\"mono\">11:05\u003c/td>\u003ctd>platform-b\u003c/td>\u003ctd class=\"num mono\">7 min\u003ci class=\"bar-dur\" style=\"width:14px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st ok\">\u003c/i>ok\u003c/td>\u003ctd>pricing_feed\u003c/td>\u003ctd class=\"mono\">10:00\u003c/td>\u003ctd>commerce\u003c/td>\u003ctd class=\"num mono\">1 min\u003ci class=\"bar-dur\" style=\"width:2px\">\u003c/i>\u003c/td>\u003ctd class=\"msg\">\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003ci class=\"st fail\">\u003c/i>failed\u003c/td>\u003ctd>crm_contacts_sync\u003c/td>\u003ctd class=\"mono\">09:14\u003c/td>\u003ctd>growth\u003c/td>\u003ctd class=\"num mono\">8 min\u003ci class=\"bar-dur\" style=\"width:16px\">\u003c/i>\u003c/td>\u003ctd class=\"msg fail-text\">HTTP 429 from source after 3 retries\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n  \u003c/main>\n  \u003caside aria-label=\"Selected run\">\n    \u003ch2>events_hourly \u003cspan class=\"mono\" style=\"color: var(--ink-2); font-size: var(--text-xs)\">#4a1f\u003c/span>\u003c/h2>\n    \u003cdl>\u003cdt>Status\u003c/dt>\u003cdd class=\"fail-text\">failed \u00b7 13:30\u003c/dd>\u003cdt>Started\u003c/dt>\u003cdd class=\"mono\">13:05 by schedule\u003c/dd>\u003cdt>Duration\u003c/dt>\u003cdd class=\"mono\">25 min (p50 6 min)\u003c/dd>\u003cdt>Owner\u003c/dt>\u003cdd>platform-b\u003c/dd>\u003c/dl>\n    \u003cpre>Timeout after 25 min\n1.9 GB staged, 0 loaded\nstage: load_events \u2192 warehouse\u003c/pre>\n    \u003cdiv class=\"actions\">\u003cbutton class=\"primary\">Retry run\u003c/button>\u003cbutton>Open log\u003c/button>\u003cbutton>Open run\u003c/button>\u003c/div>\n    \u003ch3>Last 14 runs\u003c/h3>\n    \u003cdiv class=\"hist\" aria-label=\"Duration of the last 14 runs\">\u003ci style=\"height:30%\">\u003c/i>\u003ci style=\"height:35%\">\u003c/i>\u003ci style=\"height:28%\">\u003c/i>\u003ci style=\"height:32%\">\u003c/i>\u003ci style=\"height:40%\">\u003c/i>\u003ci style=\"height:30%\">\u003c/i>\u003ci style=\"height:33%\">\u003c/i>\u003ci style=\"height:29%\">\u003c/i>\u003ci style=\"height:36%\">\u003c/i>\u003ci style=\"height:31%\">\u003c/i>\u003ci style=\"height:34%\">\u003c/i>\u003ci style=\"height:30%\">\u003c/i>\u003ci style=\"height:38%\">\u003c/i>\u003ci class=\"fail\" style=\"height:100%\">\u003c/i>\u003c/div>\n  \u003c/aside>\n\u003c/div>\n\u003cscript>/* canvas guard: a frame never navigates or opens windows */addEventListener('click',e=>{if(e.target.closest('a[href]'))e.preventDefault();},true);addEventListener('submit',e=>e.preventDefault(),true);window.open=()=>null;\u003c/script>\u003c/body>\n\u003c/html>\n"}, {"key": "B", "name": "Dense console", "screen": "Run", "pitch": "every run at once; the list never leaves: the Run screen is the panel grown wide", "file": "b-run.html", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>B \u00b7 Dense console \u00b7 Run\u003c/title>\n\u003cstyle>/* Design tokens: run-monitor. One line per token, both themes through light-dark(); the canvas and screenshot.py set data-theme.\n   Names are the contract with check_design.py (contrast pairs) and the canvas (knobs). Add tokens, do not rename these. */\n:root {\n  color-scheme: light dark;\n\n  /* knobs: the canvas sliders change these live; every value below derives from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-sm)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);\n           padding: 0 var(--space-3); min-height: 32px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }\n  button.quiet { border-color: transparent; color: var(--ink-2); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  /* the list never leaves: it shrinks to a rail of status and name, the panel takes the room */\n  .app { display: grid; grid-template-columns: 200px 260px 1fr; min-height: 100vh; }\n  .rail { background: var(--surface); border-right: 1px solid var(--border); padding: var(--space-3); display: grid; gap: var(--space-1); align-content: start; }\n  .rail strong { padding: var(--space-2); font-size: var(--text-md); letter-spacing: var(--tracking-tight); }\n  .rail a { color: var(--ink-2); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); display: flex; justify-content: space-between; }\n  .rail a[aria-current] { color: var(--ink); background: var(--surface-2); }\n  .rail a b { font-weight: 500; color: var(--danger-text); }\n  .list { border-right: 1px solid var(--border); display: grid; align-content: start; }\n  .list h1 { margin: 0; padding: var(--space-3) var(--space-3) var(--space-2); font-size: var(--text-md); letter-spacing: var(--tracking-tight); }\n  .list a { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-2); align-items: center; padding: 6px var(--space-3); color: var(--ink); text-decoration: none; border-top: 1px solid var(--border); }\n  .list a:hover { background: var(--surface-2); }\n  .list a[aria-current] { background: var(--accent-soft); }\n  .list a small { color: var(--ink-2); font-size: var(--text-xs); }\n  .st { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-sm); }\n  .st.ok { background: var(--ok); } .st.fail { background: var(--danger); } .st.run { background: var(--info); } .st.late { background: var(--warn); }\n\n  main { padding: var(--space-4) var(--space-5); display: grid; gap: var(--space-4); align-content: start; min-width: 0; }\n  main h2 { margin: 0; font-size: var(--text-xl); letter-spacing: var(--tracking-tight); display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap; }\n  main h2 span { font-size: var(--text-xs); color: var(--ink-2); }\n  .fail-text { color: var(--danger-text); }\n  dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: var(--space-1) var(--space-3); margin: 0; }\n  dt { color: var(--ink-2); } dd { margin: 0; }\n  pre { margin: 0; padding: var(--space-3); background: var(--danger-soft); color: var(--danger-text); border-radius: var(--radius-sm); font: var(--text-sm)/1.5 var(--font-mono); white-space: pre-wrap; }\n  .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }\n  .actions .quiet { margin-left: auto; }\n  h3 { margin: 0 0 var(--space-2); font-size: var(--text-sm); color: var(--ink-2); font-weight: 500; }\n  .hist { display: flex; gap: 3px; align-items: flex-end; height: 48px; max-width: 420px; }\n  .hist i { flex: 1; background: var(--ok); border-radius: var(--radius-sm); } .hist i.fail { background: var(--danger); }\n  .log { font: var(--text-xs)/1.6 var(--font-mono); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-3); margin: 0; white-space: pre-wrap; color: var(--ink-2); }\n  .log b { color: var(--danger-text); font-weight: 500; }\n\n  @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .rail, .list { display: none; } }\n  @media (max-width: 719px) { .actions button { min-height: 44px; flex: 1; } .actions .quiet { margin: 0; } dl { grid-template-columns: auto 1fr; } }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"B\" data-name=\"Dense console\" data-screen=\"Run\" data-pitch=\"every run at once; the list never leaves: the Run screen is the panel grown wide\">\n\u003cdiv class=\"app\">\n  \u003cnav class=\"rail\" aria-label=\"Main\">\n    \u003cstrong>Run monitor\u003c/strong>\n    \u003ca href=\"#\" aria-current=\"page\">Runs \u003cb>3\u003c/b>\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\n  \u003c/nav>\n  \u003cnav class=\"list\" aria-label=\"Runs, last 24 h\">\n    \u003ch1>Runs, last 24 h\u003c/h1>\n    \u003ca href=\"#\">\u003ci class=\"st run\">\u003c/i>dbt_marts_hourly\u003csmall class=\"mono\">14:30\u003c/small>\u003c/a>\n    \u003ca href=\"#\" aria-current=\"page\">\u003ci class=\"st fail\">\u003c/i>events_hourly\u003csmall class=\"mono\">13:05\u003c/small>\u003c/a>\n    \u003ca href=\"#\">\u003ci class=\"st ok\">\u003c/i>orders_daily\u003csmall class=\"mono\">14:00\u003c/small>\u003c/a>\ s from them */\n  --accent-h: 262;            /* OKLCH hue of the accent and the tint of every neutral */\n  --radius: 6px;\n  --density: 1;               /* multiplies spacing: 0.8 dense console, 1.2 airy landing page */\n  --font-size-base: 14px;\n\n  /* colour, OKLCH: equal lightness steps read as equal across hues; neutrals carry a trace of the accent hue */\n  --bg:          light-dark(oklch(97.5% 0.008 var(--accent-h)), oklch(16% 0.012 var(--accent-h)));\n  --surface:     light-dark(oklch(100% 0 0),                     oklch(20% 0.012 var(--accent-h)));\n  --surface-2:   light-dark(oklch(94.5% 0.012 var(--accent-h)), oklch(24.5% 0.014 var(--accent-h)));\n  --border:      light-dark(oklch(87% 0.008 var(--accent-h)),   oklch(33% 0.014 var(--accent-h)));  /* dividers, cards */\n  --border-strong: light-dark(oklch(62% 0.012 var(--accent-h)), oklch(60% 0.014 var(--accent-h))); /* inputs, buttons: 3:1 */\n  --ink:         light-dark(oklch(22% 0.02 var(--accent-h)),    oklch(94% 0.01 var(--accent-h)));\n  --ink-2:       light-dark(oklch(47% 0.02 var(--accent-h)),    oklch(75% 0.015 var(--accent-h)));\n  --ink-3:       light-dark(oklch(63% 0.015 var(--accent-h)),   oklch(58% 0.015 var(--accent-h)));  /* disabled only */\n  --accent:      light-dark(oklch(48% 0.19 var(--accent-h)),    oklch(78% 0.14 var(--accent-h)));\n  --accent-ink:  light-dark(oklch(99% 0 0),                      oklch(18% 0.05 var(--accent-h)));\n  --accent-soft: light-dark(oklch(94% 0.05 var(--accent-h)),    oklch(28% 0.08 var(--accent-h)));\n  --focus:       var(--accent);\n\n  /* status: fixed hues (green, amber, red, blue) regardless of the accent; -text goes on -soft, -ink goes on the solid */\n  --ok:          light-dark(oklch(50% 0.15 150), oklch(78% 0.16 150));\n  --ok-soft:     light-dark(oklch(94% 0.06 150), oklch(27% 0.07 150));\n  --ok-text:     light-dark(oklch(36% 0.12 150), oklch(86% 0.13 150));\n  --ok-ink:      light-dark(oklch(99% 0 0),      oklch(16% 0.04 150));\n  --warn:        light-dark(oklch(52% 0.14 70),  oklch(82% 0.15 80));\n  --warn-soft:   light-dark(oklch(95% 0.07 80),  oklch(28% 0.07 75));\n  --warn-text:   light-dark(oklch(40% 0.12 65),  oklch(88% 0.12 85));\n  --warn-ink:    light-dark(oklch(99% 0 0),      oklch(18% 0.05 75));\n  --danger:      light-dark(oklch(50% 0.2 25),   oklch(74% 0.18 25));\n  --danger-soft: light-dark(oklch(94% 0.05 25),  oklch(28% 0.08 25));\n  --danger-text: light-dark(oklch(38% 0.17 25),  oklch(86% 0.1 25));\n  --danger-ink:  light-dark(oklch(99% 0 0),      oklch(16% 0.05 25));\n  --info:        light-dark(oklch(50% 0.14 240), oklch(78% 0.12 240));\n  --info-soft:   light-dark(oklch(94% 0.04 240), oklch(27% 0.06 240));\n  --info-text:   light-dark(oklch(38% 0.12 240), oklch(86% 0.08 240));\n  --info-ink:    light-dark(oklch(99% 0 0),      oklch(16% 0.04 240));\n\n  /* type: system stacks only (no network); the display face is where the character comes from */\n  --font-sans: ui-sans-serif, system-ui, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  --font-display: \"Iowan Old Style\", \"Palatino Linotype\", Palatino, Georgia, \"Times New Roman\", serif;  /* the situation headline */\n  --font-mono: ui-monospace, \"Cascadia Code\", \"SF Mono\", Menlo, Consolas, \"Liberation Mono\", monospace;\n  --text-xs:  max(12px, calc(var(--font-size-base) * 0.8));   /* nothing on screen below 12px */\n  --text-sm:  calc(var(--font-size-base) * 0.875);\n  --text-md:  var(--font-size-base);\n  --text-lg:  calc(var(--font-size-base) * 1.2);\n  --text-xl:  calc(var(--font-size-base) * 1.44);\n  --text-2xl: calc(var(--font-size-base) * 1.73);\n  --text-3xl: calc(var(--font-size-base) * 2.3);\n  --leading-tight: 1.2;\n  --leading: 1.5;\n  --tracking-tight: -0.01em;\n\n  /* spacing: 4px grid scaled by density */\n  --space-1: calc(4px * var(--density));\n  --space-2: calc(8px * var(--density));\n  --space-3: calc(12px * var(--density));\n  --space-4: calc(16px * var(--density));\n  --space-5: calc(24px * var(--density));\n  --space-6: calc(32px * var(--density));\n  --space-7: calc(48px * var(--density));\n  --space-8: calc(64px * var(--density));\n\n  --radius-sm: calc(var(--radius) * 0.5);\n  --radius-md: var(--radius);\n  --radius-lg: calc(var(--radius) * 2);\n  --radius-full: 999px;\n\n  /* elevation: shadows for light, borders carry depth in dark */\n  --shadow-1: light-dark(0 1px 2px oklch(0% 0 0 / 0.08), 0 0 0 1px oklch(100% 0 0 / 0.06));\n  --shadow-2: light-dark(0 4px 14px oklch(0% 0 0 / 0.12), 0 0 0 1px oklch(100% 0 0 / 0.08));\n\n  /* motion: one fast and one base duration; nothing longer than 300ms on a UI response */\n  --motion-fast: 120ms;\n  --motion: 200ms;\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n}\n:root[data-theme=\"light\"] { color-scheme: light; }\n:root[data-theme=\"dark\"] { color-scheme: dark; }\n@media (prefers-reduced-motion: reduce) { :root { --motion-fast: 0ms; --motion: 0ms; } }\n\u003c/style>\n\u003cstyle>\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: var(--text-md)/var(--leading) var(--font-sans); }\n  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n  button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-md);\n           padding: 0 var(--space-3); min-height: 36px; cursor: pointer; transition: background var(--motion-fast) var(--ease); }\n  button:hover { background: var(--surface-2); }\n  button.primary { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }\n  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }\n\n  header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); background: var(--surface); border-bottom: 1px solid var(--border); }\n  header strong { font-size: var(--text-lg); letter-spacing: var(--tracking-tight); }\n  header nav { display: flex; gap: var(--space-1); overflow-x: auto; }\n  header nav a { color: var(--ink-2); text-decoration: none; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); white-space: nowrap; }\n  header nav a[aria-current] { color: var(--ink); background: var(--surface-2); }\n  header .primary { margin-left: auto; white-space: nowrap; }\n\n  main { padding: var(--space-5); display: grid; gap: var(--space-4); max-width: 1400px; margin: 0 auto; }\n  h1 { margin: 0; font-size: var(--text-xl); letter-spacing: var(--tracking-tight); display: flex; gap: var(--space-3); align-items: baseline; flex-wrap: wrap; }\n  h1 small { font-size: var(--text-sm); color: var(--ink-2); font-weight: 400; }\n  [role=\"tablist\"] { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); }\n  [role=\"tab\"] { border: 0; background: none; border-radius: 0; padding: var(--space-2) var(--space-3); color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }\n  [role=\"tab\"][aria-selected=\"true\"] { color: var(--ink); border-bottom-color: var(--accent); }\n  .legend { display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--ink-2); flex-wrap: wrap; }\n  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: var(--radius-sm); vertical-align: -2px; margin-right: 6px; }\n\n  .grid { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }\n  table { border-collapse: collapse; min-width: 960px; width: 100%; }\n  th, td { padding: 0; border-bottom: 1px solid var(--border); }\n  th { font-weight: 500; color: var(--ink-2); font-size: var(--text-xs); text-align: left; padding: var(--space-2) var(--space-3); background: var(--surface-2); }\n  th.hour { text-align: center; padding: var(--space-2) 0; }\n  td.name { padding: 0 var(--space-3); white-space: nowrap; font-size: var(--text-sm); width: 180px; position: sticky; left: 0; background: var(--surface); }\n  td.name small { display: block; color: var(--ink-2); font-size: var(--text-xs); }\n  td.cell { height: 44px; min-width: 44px; vertical-align: middle; padding: 3px 1px; }\n  td.cell > a { display: block; height: 100%; border-radius: var(--radius-sm); font: var(--text-xs)/38px var(--font-mono); text-align: center; text-decoration: none; }\n  .ok { background: var(--ok-soft); color: var(--ok-text); }\n  .fail { background: var(--danger); color: var(--danger-ink); }\n  .run { background: var(--info-soft); border: 1px dashed var(--info); color: var(--info-text); }\n  .late { background: var(--warn); color: var(--warn-ink); }\n  .now-line { box-shadow: inset 2px 0 var(--accent); }\n\n  @media (max-width: 719px) { main { padding: var(--space-4); } header nav { display: none; } td.name { width: 120px; } }\n\u003c/style>\n\u003c/head>\n\u003cbody data-direction=\"C\" data-name=\"Timeline\" data-screen=\"Runs\" data-pitch=\"time is the axis on every screen; late and overlapping runs only show on a time axis\">\n\u003cheader>\n  \u003cstrong>Run monitor\u003c/strong>\n  \u003cnav aria-label=\"Main\">\u003ca href=\"#\" aria-current=\"page\">Runs\u003c/a>\u003ca href=\"#\">Pipelines\u003c/a>\u003ca href=\"#\">Schedules\u003c/a>\u003ca href=\"#\">Alerts\u003c/a>\u003c/nav>\n  \u003cbutton class=\"primary\">Open 3 failed\u003c/button>\n\u003c/header>\n\u003cmain>\n  \u003ch1>Today, 14:32 \u003csmall>41 runs \u00b7 36 ok \u00b7 3 failed \u00b7 1 late \u00b7 1 running \u00b7 on call: platform-b\u003c/small>\u003c/h1>\n  \u003cdiv role=\"tablist\" aria-label=\"Day\">\u003cbutton role=\"tab\" aria-selected=\"true\">Today\u003c/button>\u003cbutton role=\"tab\">Yesterday\u003c/button>\u003cbutton role=\"tab\">This week\u003c/button>\u003c/div>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"ok\">\u003c/i>ok\u003c/span>\u003cspan>\u003ci class=\"fail\">\u003c/i>failed\u003c/span>\u003cspan>\u003ci class=
