}#dg-checkout-payment .ia-sep{fill:none;stroke:var(--dg-muted);stroke-width:1;stroke-dasharray:5 4}#dg-checkout-payment .ia-tab{fill:var(--dg-soft);stroke:var(--dg-muted);stroke-width:1.1}#dg-checkout-payment .ia-axis{stroke:var(--dg-ink);stroke-width:2;fill:none}#dg-checkout-payment .ia-emo{stroke:var(--dg-ink);stroke-width:1.8;fill:none}#dg-checkout-payment .ia-pt{stroke:var(--dg-card);stroke-width:2}#dg-checkout-payment .ia-pt.g{fill:var(--dg-green)}#dg-checkout-payment .ia-pt.a{fill:var(--dg-amber-ink)}#dg-checkout-payment .ia-pt.r{fill:var(--dg-red)}#dg-checkout-payment .ia-bpl{stroke:var(--dg-ink);stroke-width:1.4;stroke-dasharray:8 4;fill:none}#dg-checkout-payment .ia-ms{fill:var(--dg-ink);stroke:var(--dg-card);stroke-width:1.5}#dg-checkout-payment .ia-hide>.dg-sh{display:none}#dg-checkout-payment .ia-nbg{fill:var(--dg-soft)}#dg-checkout-payment .ia-mark{stroke:var(--dg-lav-ink);stroke-width:1.2;stroke-dasharray:3 3;fill:none}</style><rect class="dg-bg" width="933" height="885"/><text class="dg-title" x="16" y="22">Checkout: paying for an order with a card</text><g transform="translate(0,32)"><defs><marker id="dg-checkout-payment-filled-n" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-mk" d="M1,1 L12,5 L1,9 Z"/></marker><marker id="dg-checkout-payment-open-n" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-mkl" d="M1,1 L11,5 L1,9"/></marker></defs><path class="ia-life" d="M48.5,82 L48.5,769"/><path class="ia-life" d="M237.7,82 L237.7,769"/><path class="ia-life" d="M459.9,82 L459.9,769"/><path class="ia-life" d="M697.9,82 L697.9,769"/><path class="ia-life" d="M846.4,82 L846.4,769"/><rect class="ia-frame" x="32.5" y="353" width="386.4" height="180" rx="2"/><path class="ia-sep" d="M32.5,455 L418.9,455"/><rect class="ia-frame" x="226.7" y="611" width="244.2" height="106" rx="2"/><path class="dg-e solid" d="M48.5,122 L232.7,122" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e solid" d="M242.7,156 L454.9,156" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e solid" d="M464.9,190 L692.9,190" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e dashed" d="M692.9,224 L464.9,224" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e dashed" d="M454.9,258 L242.7,258" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e solid" d="M232.7,405 L48.5,405" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e dashed" d="M48.5,439 L232.7,439" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e solid" d="M242.7,499 L267.7,499 Q272.7,499 272.7,504 L272.7,510 Q272.7,515 267.7,515 L244.7,515" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e solid" d="M697.9,565 L459.9,565" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e solid" d="M459.9,599 L846.4,599" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e solid" d="M242.7,663 L454.9,663" marker-end="url(#dg-checkout-payment-filled-n)"/><path class="dg-e dashed" d="M454.9,697 L242.7,697" marker-end="url(#dg-checkout-payment-open-n)"/><path class="dg-e dashed" d="M232.7,749 L48.5,749" marker-end="url(#dg-checkout-payment-open-n)"/><rect class="ia-act" x="692.9" y="190" width="10" height="34" rx="0"/><rect class="ia-act" x="454.9" y="156" width="10" height="102" rx="0"/><rect class="ia-act" x="454.9" y="663" width="10" height="34" rx="0"/><rect class="ia-act" x="232.7" y="122" width="10" height="627" rx="0"/><path class="ia-tab" d="M32.5,353 H71.1 V366 L65.1,373 H32.5 Z"/><rect class="dg-bg" x="77.1" y="356" width="144.6" height="16" rx="2"/><rect class="dg-bg" x="38.5" y="459" width="98.4" height="16" rx="2"/><path class="ia-tab" d="M226.7,611 H272.2 V624 L266.2,631 H226.7 Z"/><rect class="dg-bg" x="278.2" y="614" width="144.6" height="16" rx="2"/><g class="dg-n dg-t-plain" data-id="shopper"><rect x="16" y="17" width="65" height="65" fill="none"/><circle class="dg-act" cx="48.5" cy="25" r="7"/><path class="dg-act" d="M48.5,32 V47 M37.5,37 H59.5 M48.5,47 L39.5,58 M48.5,47 L57.5,58"/><text class="dg-l" x="48.5" y="73.1" text-anchor="middle">Shopper</text></g><g class="dg-n dg-t-plain" data-id="web"><rect class="dg-sh" x="189.7" y="32" width="96" height="50" rx="3"/><text class="dg-l" x="237.7" y="53.1" text-anchor="middle">web-shop</text><text class="dg-s" x="237.7" y="68.9" text-anchor="middle">Next.js</text></g><g class="dg-n dg-t-plain" data-id="api"><rect class="dg-sh" x="403.9" y="32" width="112" height="50" rx="3"/><text class="dg-l" x="459.9" y="53.1" text-anchor="middle">checkout-api</text><text class="dg-s" x="459.9" y="68.9" text-anchor="middle">FastAPI</text></g><g class="dg-n dg-t-plain" data-id="psp"><rect class="dg-sh" x="625.9" y="32" width="144" height="50" rx="3"/><text class="dg-l" x="697.9" y="53.1" text-anchor="middle">Payment provider</text><text class="dg-s" x="697.9" y="68.9" text-anchor="middle">REST + webhooks</text></g><g class="dg-n dg-t-plain" data-id="bus"><path class="dg-sh" d="M793.9,23 A52.5,7 0 0 1 898.9,23 V75 A52.5,7 0 0 1 793.9,75 Z"/><path class="dg-sh2" d="M793.9,23 A52.5,7 0 0 0 898.9,23"/><text class="dg-l" x="846.4" y="48.6" text-anchor="middle">orders topic</text><text class="dg-s" x="846.4" y="64.4" text-anchor="middle">Kafka</text></g><g class="dg-n dg-t-amber" data-id="note5"><path class="dg-sh" d="M471.9,270 H673.9 L683.9,280 V339 H471.9 Z"/><path class="dg-sh2" d="M673.9,270 V280 H683.9"/><text class="dg-l" x="577.9" y="291.1" text-anchor="middle">Idempotency key = order id,</text><text class="dg-l" x="577.9" y="308.1" text-anchor="middle">so a retried POST never</text><text class="dg-l" x="577.9" y="325.1" text-anchor="middle">charges twice.</text></g><text class="dg-txm" x="38.5" y="366.4" text-anchor="start">alt</text><text class="dg-txm" x="80.1" y="367.4" text-anchor="start">[3-D Secure required]</text><text class="dg-txm" x="41.5" y="470.4" text-anchor="start">[frictionless]</text><text class="dg-txm" x="232.7" y="624.5" text-anchor="start">loop</text><text class="dg-txm" x="281.2" y="625.5" text-anchor="start">[every 2 s, max 30 s]</text><g class="dg-lb"><rect x="82.8" y="103" width="115.6" height="16" rx="3"/><text x="140.6" y="114.8" text-anchor="middle">1. Pay 84.90 EUR</text></g><g class="dg-lb"><rect x="264.6" y="137" width="168.4" height="16" rx="3"/><text x="348.8" y="148.8" text-anchor="middle">2. POST /orders/{id}/pay</text></g><g class="dg-lb"><rect x="494.7" y="171" width="168.4" height="16" rx="3"/><text x="578.9" y="182.8" text-anchor="middle">3. create payment intent</text></g><g class="dg-lb"><rect x="491.4" y="205" width="175" height="16" rx="3"/><text x="578.9" y="216.8" text-anchor="middle">4. intent pi_3Kx, pending</text></g><g class="dg-lb"><rect x="294.3" y="239" width="109" height="16" rx="3"/><text x="348.8" y="250.8" text-anchor="middle">5. 202 Accepted</text></g><g class="dg-lb"><rect x="63" y="386" width="155.2" height="16" rx="3"/><text x="140.6" y="397.8" text-anchor="middle">6. show bank challenge</text></g><g class="dg-lb"><rect x="63" y="420" width="155.2" height="16" rx="3"/><text x="140.6" y="431.8" text-anchor="middle">7. approve in bank app</text></g><g class="dg-lb"><rect x="280.7" y="499" width="122.2" height="16" rx="3"/><text x="341.8" y="510.8" text-anchor="middle">8. skip challenge</text></g><g class="dg-lb"><rect x="481.5" y="546" width="194.8" height="16" rx="3"/><text x="578.9" y="557.8" text-anchor="middle">9. webhook payment.succeeded</text></g><g class="dg-lb"><rect x="605.2" y="580" width="95.8" height="16" rx="3"/><text x="653.1" y="591.8" text-anchor="middle">10. OrderPaid</text></g><g class="dg-lb"><rect x="254.7" y="644" width="188.2" height="16" rx="3"/><text x="348.8" y="655.8" text-anchor="middle">11. GET /orders/{id}/status</text></g><g class="dg-lb"><rect x="317.4" y="678" width="62.8" height="16" rx="3"/><text x="348.8" y="689.8" text-anchor="middle">12. paid</text></g><g class="dg-lb"><rect x="63" y="730" width="155.2" height="16" rx="3"/><text x="140.6" y="741.8" text-anchor="middle">13. order confirmation</text></g></g><text class="dg-key" x="16" y="833">Key: Solid + filled head = synchronous call · open head = asynchronous message · dashed = reply · white bar = active · frame = alt</text><text class="dg-key" x="16" y="849">/ loop</text><text class="dg-notice" x="16" y="870">Notice: The order is confirmed only after the PSP webhook arrives; the browser polls status instead of waiting on the charge call.</text></svg>