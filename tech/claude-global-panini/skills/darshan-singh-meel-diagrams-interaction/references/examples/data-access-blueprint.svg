y"><rect class="dg-sh" x="752" y="136" width="132" height="40" rx="8"/><text class="dg-l" x="818" y="159.6" text-anchor="middle">Runs first query</text></g><g class="dg-n dg-t-teal" data-id="f_bot"><rect class="dg-sh" x="214" y="218" width="100" height="67" rx="8"/><text class="dg-l" x="264" y="239.1" text-anchor="middle">Access bot</text><text class="dg-l" x="264" y="256.1" text-anchor="middle">confirms</text><text class="dg-s" x="264" y="271.9" text-anchor="middle">chat</text></g><g class="dg-n dg-t-teal" data-id="f_mgr"><rect class="dg-sh" x="380" y="226.5" width="152" height="50" rx="8"/><text class="dg-l" x="456" y="247.6" text-anchor="middle">Manager approves</text><text class="dg-s" x="456" y="263.4" text-anchor="middle">in the ticket</text></g><g class="dg-n dg-t-red dg-strong" data-id="b_grant"><rect class="dg-sh" x="581.5" y="321" width="121" height="66" rx="8"/><text class="dg-l" x="642" y="342.1" text-anchor="middle">Admin applies</text><text class="dg-l" x="642" y="359.1" text-anchor="middle">grant by hand</text><text class="dg-g" x="642" y="373.9" text-anchor="middle">fail point</text></g><g class="dg-n dg-t-plain" data-id="b_audit"><rect class="dg-sh" x="756.5" y="334" width="123" height="40" rx="8"/><text class="dg-l" x="818" y="357.6" text-anchor="middle">Audit log entry</text></g><g class="dg-n dg-t-soft" data-id="s_idp"><rect class="dg-sh" x="389.5" y="423" width="133" height="50" rx="8"/><text class="dg-l" x="456" y="444.1" text-anchor="middle">Identity provider</text><text class="dg-s" x="456" y="459.9" text-anchor="middle">group sync</text></g><g class="dg-n dg-t-soft" data-id="s_wh"><rect class="dg-sh" x="572" y="423" width="140" height="50" rx="8"/><text class="dg-l" x="642" y="444.1" text-anchor="middle">Warehouse roles</text><text class="dg-s" x="642" y="459.9" text-anchor="middle">Terraform</text></g><text class="dg-tx" x="24" y="193.4" text-anchor="start">line of interaction</text><text class="dg-tx" x="24" y="296.4" text-anchor="start">line of visibility</text><text class="dg-tx" x="24" y="398.4" text-anchor="start">line of internal interaction</text><g class="dg-n dg-t-red dg-strong"><rect class="dg-sh" x="17" y="510" width="18" height="12" rx="2"/></g><text class="dg-lg" x="42" y="520">fail point</text></g><text class="dg-key" x="16" y="587">Key: Lane = blueprint layer · dashed lines = interaction, visibility, internal interaction · red thick = fail point · arrow =</text><text class="dg-key" x="16" y="603">triggers</text><text class="dg-notice" x="16" y="624">Notice: The fail point sits backstage: grants are applied by hand from the ticket, so the analyst waits on a person they never see.</text></svg>