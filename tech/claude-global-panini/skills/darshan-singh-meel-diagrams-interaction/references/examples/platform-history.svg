</text><text class="dg-l" x="418.5" y="215.1" text-anchor="middle">orders</text></g><g class="dg-n dg-t-ink dg-solid" data-id="p3"><rect class="dg-sh" x="531.5" y="44" width="96" height="40" rx="20"/><text class="dg-l" x="579.5" y="67.6" text-anchor="middle">2024</text></g><g class="dg-n dg-t-red" data-id="e3_0"><rect class="dg-sh" x="507" y="102" width="145" height="67" rx="8"/><text class="dg-l" x="579.5" y="123.1" text-anchor="middle">Warehouse cost</text><text class="dg-l" x="579.5" y="140.1" text-anchor="middle">+60%</text><text class="dg-s" x="579.5" y="155.9" text-anchor="middle">full refreshes</text></g><g class="dg-n dg-t-plain" data-id="e3_1"><rect class="dg-sh" x="507" y="179" width="145" height="52" rx="8"/><text class="dg-l" x="579.5" y="200.1" text-anchor="middle">Incremental</text><text class="dg-l" x="579.5" y="217.1" text-anchor="middle">models</text></g><g class="dg-n dg-t-ink dg-solid" data-id="p4"><rect class="dg-sh" x="692.5" y="44" width="96" height="40" rx="20"/><text class="dg-l" x="740.5" y="67.6" text-anchor="middle">2025</text></g><g class="dg-n dg-t-plain" data-id="e4_0"><rect class="dg-sh" x="668" y="102" width="145" height="67" rx="8"/><text class="dg-l" x="740.5" y="123.1" text-anchor="middle">Iceberg tables on</text><text class="dg-l" x="740.5" y="140.1" text-anchor="middle">S3</text><text class="dg-s" x="740.5" y="155.9" text-anchor="middle">Athena + Trino</text></g><g class="dg-n dg-t-ink dg-solid" data-id="p5"><rect class="dg-sh" x="853.5" y="44" width="96" height="40" rx="20"/><text class="dg-l" x="901.5" y="67.6" text-anchor="middle">2026</text></g><g class="dg-n dg-t-green" data-id="e5_0"><rect class="dg-sh" x="829" y="102" width="145" height="52" rx="8"/><text class="dg-l" x="901.5" y="123.1" text-anchor="middle">Self-serve</text><text class="dg-l" x="901.5" y="140.1" text-anchor="middle">semantic layer</text></g><g class="dg-n dg-t-plain" data-id="e5_1"><rect class="dg-sh" x="829" y="164" width="145" height="67" rx="8"/><text 