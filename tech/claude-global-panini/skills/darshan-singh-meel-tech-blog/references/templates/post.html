<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<style>
  :root { --ink: #1c2127; --soft: #5a6470; --line: #d9dee4; --code: #f4f6f8; --link: #0b5cad; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1, h2, h3, .meta, table { font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .4rem; }
  h2 { font-size: 1.35rem; margin: 2.2rem 0 .6rem; }
  h3 { font-size: 1.1rem; margin: 1.6rem 0 .4rem; }
  .meta { color: var(--soft); font-size: .85rem; margin: 0 0 1.6rem; }
  a { color: var(--link); }
  code { font: .88em/1.5 Consolas, "Courier New", monospace; background: var(--code); padding: .1em .3em; border-radius: 3px; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: .8rem 1rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: 1rem 0; }
  th, td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; vertical-align: top; }
  th { background: var(--code); }
  figure { margin: 1.4rem 0; }
  figure svg, img { max-width: 100%; height: auto; }
  blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--soft); }
  @media print { main { max-width: none; padding: 0; } pre { white-space: pre-wrap; } a { color: inherit; } h2, h3 { break-after: avoid; } pre, figure, table { break-inside: avoid; } }
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<p class="meta">{{date}} · {{tags}}</p>
{{body}}
</main>
</body>
</html>
