"/><g class="dg-n dg-t-plain" data-id="prep"><rect class="dg-sh" x="70" y="70" width="138" height="50" rx="8"/><text class="dg-l" x="139" y="91.1" text-anchor="middle">Build training set</text><text class="dg-s" x="139" y="106.9" text-anchor="middle">dbt, 24 months</text></g><g class="dg-n dg-t-lav" data-id="train"><rect class="dg-sh" x="278.5" y="70" width="126" height="50" rx="8"/><text class="dg-l" x="341.5" y="91.1" text-anchor="middle">Train</text><text class="dg-s" x="341.5" y="106.9" text-anchor="middle">gradient boosting</text></g><g class="dg-n dg-t-amber" data-id="evaluate"><polygon class="dg-sh" points="637.9,55 724.4,95 637.9,135 551.4,95"/><text class="dg-l" x="637.9" y="91.1" text-anchor="middle">Offline eval</text><text class="dg-s" x="637.9" y="106.9" text-anchor="middle">AUC, calibration</text></g><g class="dg-n dg-t-blue" data-id="register"><path class="dg-sh" d="M571.4,239 A66.5,7 0 0 1 704.4,239 V291 A66.5,7 0 0 1 571.4,291 Z"/><path class="dg-sh2" d="M571.4,239 A66.5,7 0 0 0 704.4,239"/><text class="dg-l" x="637.9" y="264.6" text-anchor="middle">Model registry</text><text class="dg-s" x="637.9" y="280.4" text-anchor="middle">stage = production</text></g><g class="dg-n dg-t-plain" data-id="deploy"><rect class="dg-sh" x="268" y="240" width="147" height="50" rx="8"/><text class="dg-l" x="341.5" y="261.1" text-anchor="middle">Batch scoring</text><text class="dg-s" x="341.5" y="276.9" text-anchor="middle">nightly, all customers</text></g><g class="dg-n dg-t-soft dg-dash" data-id="monitor"><rect class="dg-sh" x="75.5" y="240" width="127" height="50" rx="8"/><text class="dg-l" x="139" y="261.1" text-anchor="middle">Monitor</text><text class="dg-s" x="139" y="276.9" text-anchor="middle">drift, precision@k</text></g><g class="dg-lb"><rect x="438.5" y="37" width="102.4" height="16" rx="3"/><text x="489.7" y="48.8" text-anchor="middle">AUC below 0.80</text></g><g class="dg-lb"><rect x="42" y="172" width="82.6" height="16" rx="3"/><text x="83.3" y="183.8" text-anchor="middle">drift alert</text></g><g class="dg-n dg-t-plain"><rect class="dg-sh" x="17" y="331" width="18" height="12" rx="2"/></g><text class="dg-lg" x="42" y="341">step</text><g class="dg-n dg-t-lav"><rect class="dg-sh" x="87.4" y="331" width="18" height="12" rx="2"/></g><text class="dg-lg" x="112.4" y="341">model</text><g class="dg-n dg-t-amber"><rect class="dg-sh" x="164.4" y="331" width="18" height="12" rx="2"/></g><text class="dg-lg" x="189.4" y="341">gate</text><g class="dg-n dg-t-blue"><rect class="dg-sh" x="234.8" y="331" width="18" height="12" rx="2"/></g><text class="dg-lg" x="259.8" y="341">store</text><g class="dg-n dg-t-soft"><rect class="dg-sh" x="311.8" y="331" width="18" height="12" rx="2"/></g><text class="dg-lg" x="336.8" y="341">monitoring</text><path class="dg-e dashed c-blue" d="M420.8,337 H440.8"/><text class="dg-lg" x="446.8" y="341">feedback loop</text></g><text class="dg-key" x="16" y="408">Key: Box = stage (tool in the sub line) · cylinder = store · diamond = gate · dashed blue = feedback</text><text class="dg-key" x="16" y="424">loop that retrains</text><text class="dg-notice" x="16" y="445">Notice: Two loops retrain the model: a failed offline eval goes straight back to training, a drift alert rebuilds the training</text><text class="dg-notice" x="16" y="463">set.</text></svg>