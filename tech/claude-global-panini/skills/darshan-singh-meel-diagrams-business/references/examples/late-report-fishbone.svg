end">unannounced</text><text class="bz-i" x="393.1" y="151.6" text-anchor="end">Manual approval step</text><text class="bz-i" x="402.3" y="173.6" text-anchor="end">No owner on weekends</text><text class="bz-i" x="594.5" y="151.6" text-anchor="end">Warehouse queue at 06:00</text><text class="bz-i" x="603.7" y="173.6" text-anchor="end">Retries without backoff</text><text class="bz-i" x="224.7" y="217.6" text-anchor="end">One engineer knows the job</text><text class="bz-i" x="215.5" y="239.6" text-anchor="end">No runbook</text><text class="bz-i" x="402.3" y="217.6" text-anchor="end">Job starts at fixed 05:00</text><text class="bz-i" x="386.4" y="239.6" text-anchor="end">Waits for finance close</text><text class="dg-tx" x="386.4" y="255.3" text-anchor="end">– month-end only</text><text class="bz-i" x="603.7" y="217.6" text-anchor="end">Alert goes to a shared inbox</text></g><text class="dg-key" x="16" y="378">Key: Head = problem · bone = cause category · text = cause, dash = sub-cause</text><text class="dg-notice" x="16" y="399">Notice: Three of the twelve causes sit under Data: late and duplicate source exports drive most delays.</text></svg>